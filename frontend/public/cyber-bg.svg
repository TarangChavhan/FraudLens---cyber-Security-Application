<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a" />
      <stop offset="50%" stop-color="#0b1b36" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="shieldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="cyberGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="60" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Dark Base -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- Grid Overlay -->
  <rect width="1920" height="1080" fill="url(#cyberGrid)" />

  <!-- Central Glowing Aura -->
  <circle cx="960" cy="480" r="550" fill="url(#shieldAura)" />

  <!-- Tech Geometric Hexagons & Circuit Paths -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-opacity="0.25">
    <polygon points="960,180 1140,284 1140,492 960,596 780,492 780,284" />
    <polygon points="960,220 1105,304 1105,472 960,556 815,472 815,304" />
    <path d="M 780 492 L 600 596 L 360 596 L 240 700" />
    <path d="M 1140 492 L 1320 596 L 1560 596 L 1680 700" />
    <path d="M 960 596 L 960 760 L 800 850 L 620 850" />
    <path d="M 960 760 L 1120 850 L 1300 850" />
    <path d="M 780 284 L 620 190 L 400 190" />
    <path d="M 1140 284 L 1300 190 L 1520 190" />
  </g>

  <!-- Circuit Connection Dots -->
  <g fill="#38bdf8" fill-opacity="0.7">
    <circle cx="240" cy="700" r="4" />
    <circle cx="360" cy="596" r="3" />
    <circle cx="600" cy="596" r="3.5" />
    <circle cx="1680" cy="700" r="4" />
    <circle cx="1560" cy="596" r="3" />
    <circle cx="1320" cy="596" r="3.5" />
    <circle cx="620" cy="850" r="3" />
    <circle cx="1300" cy="850" r="3" />
    <circle cx="400" cy="190" r="3" />
    <circle cx="1520" cy="190" r="3" />
  </g>

  <!-- Floating Binary/Data Accents -->
  <g fill="#38bdf8" fill-opacity="0.15" font-family="monospace" font-size="14">
    <text x="120" y="240">01000110 01010010 01000001 01010101 01000100</text>
    <text x="140" y="270">SECURE_HASH: 98E0AB8AB0F6F03E5C0161</text>
    <text x="1400" y="240">DEFENSE_MATRIX: ACTIVE</text>
    <text x="1400" y="270">AI_THREAT_SCANNER: ONLINE</text>
    <text x="150" y="880">JURISDICTION: NATIONAL CYBER CELL</text>
    <text x="1420" y="880">ENCRYPTION: AES-256 GCM</text>
  </g>
</svg>
